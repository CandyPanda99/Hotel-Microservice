spring:
  application:
    name: gatewayserver
  config:
    import: "configserver:http://localhost:8071"
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10000ms
  circuitbreaker:
    instances:
      hotelCircuitBreaker:
        registerHealthIndicator: true
      reservationCircuitBreaker:
        registerHealthIndicator: true
      userCircuitBreaker:
        registerHealthIndicator: true
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
